# Backend on Render (Docker, free plan). "New > Blueprint" in the Render dashboard, or deployed via API.
# Free instances have no persistent disk: uploads/results live for the life of the instance,
# and the API key comes from ANTHROPIC_API_KEY rather than the Settings page.
services:
  - type: web
    name: form-extractor-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FORM_LLM_PROVIDER      # gemini | claude (can also be switched on the Settings page)
        value: gemini
      - key: GEMINI_API_KEY         # Google AI Studio key (free tier works)
        sync: false
      - key: ANTHROPIC_API_KEY      # optional, for the Claude provider
        sync: false
      - key: PADDLE_OCR_URL         # optional: URL of a `paddlex --serve --pipeline PaddleOCR-VL` server
        sync: false
      - key: FORM_ADMIN_TOKEN       # protects the Settings page on the public link
        generateValue: true
      - key: FORM_MAX_UPLOAD_MB
        value: "15"
      - key: FORM_MAX_RESTARTS       # free instance = 0.1 CPU: keep the search short so health checks answer in time
        value: "3"
      - key: FORM_MAX_ITERATIONS
        value: "60"
